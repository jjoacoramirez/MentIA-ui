<script>
  (function() {
    const selectedSequence = [];
    const maxSelections = 4;
    const buttons = document.querySelectorAll('.symbol-node');
    const submitBtn = document.getElementById('btn-submit');
    const resetBtn = document.getElementById('btn-reset');

    function updateSlots() {
      for (let i = 0; i < maxSelections; i++) {
        const slot = document.getElementById(`slot-${i}`);
        const slotText = slot.querySelector('.slot-text');
        const slotLabel = slot.querySelector('.slot-label');

        if (selectedSequence[i]) {
          slot.className = 'h-14 rounded-DEFAULT bg-accent-cyan-light flex flex-col items-center justify-center transition-all scale-100 shadow-sm';
          slotText.className = 'slot-text font-headline-sm text-headline-sm text-accent-cyan font-bold';
          slotText.textContent = selectedSequence[i].id;
          slotLabel.className = 'slot-label font-label-sm text-label-sm text-accent-cyan truncate max-w-[65px]';
          slotLabel.textContent = selectedSequence[i].symbol;
          slotLabel.classList.remove('hidden');
        } else {
          slot.className = 'h-14 rounded-DEFAULT bg-surface-subtle flex flex-col items-center justify-center transition-colors';
          slotText.className = 'slot-text font-headline-sm text-headline-sm text-text-muted';
          slotText.textContent = '-';
          slotLabel.classList.add('hidden');
        }
      }

      if (selectedSequence.length === maxSelections) {
        submitBtn.disabled = false;
        submitBtn.className = 'w-full h-[54px] rounded-full bg-accent-cyan hover:bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md transition-all duration-150 active:scale-[0.98] cursor-pointer';
      } else {
        submitBtn.disabled = true;
        submitBtn.className = 'w-full h-[54px] rounded-full bg-surface-dim text-text-muted font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm transition-all duration-200 cursor-not-allowed';
      }
    }

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const symbol = btn.getAttribute('data-symbol');
        const badge = btn.querySelector('.selection-badge');
        const indicator = btn.querySelector('.order-indicator');

        const existingIndex = selectedSequence.findIndex(item => item.id === id);

        if (existingIndex > -1) {
          selectedSequence.splice(existingIndex, 1);
          badge.classList.add('hidden');
          badge.classList.remove('flex');
          // Re-render order badges
          refreshBadges();
        } else {
          if (selectedSequence.length < maxSelections) {
            selectedSequence.push({ id, symbol, element: btn });
            badge.classList.remove('hidden');
            badge.classList.add('flex');
            indicator.textContent = selectedSequence.length;
          }
        }
        updateSlots();
      });
    });

    function refreshBadges() {
      buttons.forEach(b => {
        const badge = b.querySelector('.selection-badge');
        badge.classList.add('hidden');
        badge.classList.remove('flex');
      });
      selectedSequence.forEach((item, index) => {
        const b = item.element;
        const badge = b.querySelector('.selection-badge');
        const indicator = b.querySelector('.order-indicator');
        badge.classList.remove('hidden');
        badge.classList.add('flex');
        indicator.textContent = index + 1;
      });
    }

    resetBtn.addEventListener('click', () => {
      selectedSequence.length = 0;
      refreshBadges();
      updateSlots();
    });

    submitBtn.addEventListener('click', () => {
      if (selectedSequence.length === maxSelections) {
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Procesando...</span>';
        setTimeout(() => {
          submitBtn.className = 'w-full h-[54px] rounded-full bg-success text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md';
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>¡Completado con éxito!</span>';
        }, 600);
      }
    });

    // Temporizador regresivo estético
    let seconds = 43;
    const timerElem = document.getElementById('session-timer');
    const timerInterval = setInterval(() => {
      if (seconds > 0) {
        seconds--;
        timerElem.textContent = '00:' + (seconds < 10 ? '0' : '') + seconds;
      } else {
        clearInterval(timerInterval);
      }
    }, 1000);
  })();
</script></main></body></html>
