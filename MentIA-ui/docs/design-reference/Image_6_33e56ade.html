<span>Confirmar respuesta</span>

</button>

<script>
  (function() {
    let currentStep = 1;
    const maxSteps = 4;
    let selectedCells = [];
    let timeLeft = 45;

    const timerDisplay = document.getElementById('timer-display');
    const feedbackBanner = document.getElementById('feedback-banner');
    const feedbackText = document.getElementById('feedback-text');
    const feedbackIcon = document.getElementById('feedback-icon');
    const confirmBtn = document.getElementById('confirm-btn');
    const sequenceTrail = document.getElementById('sequence-trail');
    const resetTrailBtn = document.getElementById('reset-trail-btn');
    const cellButtons = document.querySelectorAll('.cell-node');

    // Cronómetro regresivo sutil
    const timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const secs = String(timeLeft % 60).padStart(2, '0');
        if (timerDisplay) timerDisplay.textContent = `${mins}:${secs}`;
      } else {
        clearInterval(timerInterval);
      }
    }, 1000);

    function triggerFeedback(msg, isSuccess = true) {
      if (!feedbackBanner) return;
      feedbackText.textContent = msg;
      if (isSuccess) {
        feedbackBanner.className = "mt-3 w-full py-1.5 px-3 rounded-full bg-primary/20 opacity-100 transform translate-y-0 transition-all duration-300 flex items-center justify-center gap-1.5 text-surface-tint";
        feedbackIcon.textContent = "check_circle";
        feedbackIcon.className = "material-symbols-outlined text-[18px] text-surface-tint";
      } else {
        feedbackBanner.className = "mt-3 w-full py-1.5 px-3 rounded-full bg-error-container opacity-100 transform translate-y-0 transition-all duration-300 flex items-center justify-center gap-1.5 text-on-error-container";
        feedbackIcon.textContent = "error";
        feedbackIcon.className = "material-symbols-outlined text-[18px] text-on-error-container";
      }
      setTimeout(() => {
        feedbackBanner.classList.add('opacity-0', 'translate-y-1');
      }, 2400);
    }

    function updateTrail() {
      const trailSlots = sequenceTrail.children;
      for (let i = 0; i < maxSteps; i++) {
        if (selectedCells[i]) {
          trailSlots[i].textContent = selectedCells[i];
          trailSlots[i].className = "w-6 h-6 rounded-full bg-primary text-on-primary font-label-sm text-label-sm flex items-center justify-center font-bold";
        } else {
          trailSlots[i].textContent = "-";
          trailSlots[i].className = "w-6 h-6 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm flex items-center justify-center";
        }
      }

      if (selectedCells.length === maxSteps) {
        confirmBtn.removeAttribute('disabled');
        confirmBtn.className = "w-full h-14 rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm font-bold tracking-wider uppercase transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-primary/25 active:scale-[0.98]";
        triggerFeedback("¡Secuencia lista para verificar!", true);
      } else {
        confirmBtn.setAttribute('disabled', 'true');
        confirmBtn.className = "w-full h-14 rounded-xl bg-surface-container-highest text-on-surface-variant font-headline-sm text-headline-sm font-bold tracking-wider uppercase transition-all duration-200 flex items-center justify-center gap-2 cursor-not-allowed shadow-md active:scale-[0.98]";
      }
    }

    function resetSelection() {
      selectedCells = [];
      cellButtons.forEach(btn => {
        btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'scale-95');
        btn.classList.add('bg-surface-container');
        const badge = btn.querySelector('.badge-order');
        if (badge) badge.classList.add('opacity-0');
        const icon = btn.querySelector('.symbol-icon');
        if (icon) {
          icon.classList.remove('text-on-primary-container');
          icon.classList.add('text-on-surface');
        }
      });
      updateTrail();
    }

    cellButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cellId = btn.getAttribute('data-cell');
        const isAlreadySelected = selectedCells.includes(cellId);

        if (isAlreadySelected) {
          // Deseleccionar
          selectedCells = selectedCells.filter(id => id !== cellId);
          btn.classList.remove('bg-primary-container', 'text-on-primary-container');
          btn.classList.add('bg-surface-container');
          const badge = btn.querySelector('.badge-order');
          if (badge) badge.classList.add('opacity-0');
          const icon = btn.querySelector('.symbol-icon');
          if (icon) {
            icon.classList.remove('text-on-primary-container');
            icon.classList.add('text-on-surface');
          }
          updateTrail();
        } else if (selectedCells.length < maxSteps) {
          // Nueva selección
          selectedCells.push(cellId);
          btn.classList.remove('bg-surface-container');
          btn.classList.add('bg-primary-container', 'text-on-primary-container');
          const badge = btn.querySelector('.badge-order');
          if (badge) {
            badge.textContent = selectedCells.length;
            badge.classList.remove('opacity-0');
          }
          const icon = btn.querySelector('.symbol-icon');
          if (icon) {
            icon.classList.remove('text-on-surface');
            icon.classList.add('text-on-primary-container');
          }
          triggerFeedback(`¡Paso ${selectedCells.length} registrado!`, true);
          updateTrail();
        }
      });
    });

    if (resetTrailBtn) {
      resetTrailBtn.addEventListener('click', resetSelection);
    }

    if (confirmBtn) {
      confirmBtn.addEventListener('click', () => {
        if (selectedCells.length === maxSteps) {
          triggerFeedback("¡Excelente! Procesando agilidad...", true);
          confirmBtn.innerHTML = `
            <span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span>
            <span>Comprobando...</span>
          `;
          setTimeout(() => {
            confirmBtn.innerHTML = `
              <span class="material-symbols-outlined text-[22px]">done_all</span>
              <span>¡Correcto! +120 Puntos</span>
            `;
            confirmBtn.className = "w-full h-14 rounded-xl bg-tertiary text-on-tertiary font-headline-sm text-headline-sm font-bold tracking-wider uppercase transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-tertiary/20";
          }, 800);
        }
      });
    }

    const exitBtn = document.getElementById('exit-btn');
    if (exitBtn) {
      exitBtn.addEventListener('click', () => {
        if (confirm("¿Pausar sesión de entrenamiento actual?")) {
          window.history.back();
        }
      });
    }
  })();
</script></main></div></body></html>
